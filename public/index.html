<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>Filmlo — Xem phim miễn phí</title>
<style>
:root{
  --bg:#080a12;--surface:#10151f;--surface2:#1a2232;--border:#253352;
  --text:#eef2fa;--muted:#93a0b8;--accent:#6366f1;--accent2:#c084fc;
  --glow:rgba(99,102,241,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:
  radial-gradient(ellipse 80% 50% at 50% -10%, rgba(99,102,241,.14), transparent 60%),
  radial-gradient(ellipse 60% 40% at 85% 20%, rgba(192,132,252,.08), transparent 60%),
  var(--bg);
  color:var(--text);font-family:"Segoe UI",system-ui,Arial,sans-serif;min-height:100vh}
a{color:inherit}

header{background:rgba(8,10,18,.82);border-bottom:1px solid rgba(37,51,82,.6);position:fixed;top:0;left:0;width:100%;box-sizing:border-box;z-index:50;backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);padding-top:env(safe-area-inset-top)}
.top{max-width:1300px;margin:auto;padding:13px 24px;display:flex;align-items:center;gap:22px}
.logo{font-size:23px;font-weight:800;text-decoration:none;background:linear-gradient(90deg,#818cf8,var(--accent2) 55%,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.5px;filter:drop-shadow(0 0 14px var(--glow))}
nav{display:flex;gap:3px}
nav a{color:var(--muted);text-decoration:none;font-size:13.5px;padding:8px 13px;border-radius:9px;white-space:nowrap;transition:.18s}
nav a:hover{color:var(--text);background:var(--surface2)}
nav a.active{color:#fff;background:linear-gradient(90deg,rgba(99,102,241,.28),rgba(192,132,252,.22));box-shadow:inset 0 0 0 1px rgba(129,140,248,.4);font-weight:600}

.search-wrap{margin-left:auto;position:relative;width:280px}
.search-wrap input{width:100%;padding:10px 14px 10px 38px;background:rgba(16,21,31,.75);border:1px solid var(--border);border-radius:12px;color:var(--text);font-size:13.5px;outline:none;transition:.2s}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.18)}
.search-wrap::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.55;pointer-events:none}
.suggest{position:absolute;top:calc(100% + 6px);left:0;right:0;background:rgba(16,21,31,.97);border:1px solid var(--border);border-radius:14px;overflow:hidden;display:none;box-shadow:0 22px 60px rgba(0,0,0,.7);max-height:420px;overflow-y:auto;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.suggest.show{display:block}
.sg-item{display:flex;gap:10px;padding:9px 12px;cursor:pointer;align-items:center;transition:.15s}
.sg-item:hover{background:var(--surface2)}
.sg-item img{width:38px;height:56px;object-fit:cover;border-radius:7px;flex-shrink:0;background:var(--surface2)}
.sg-item .t{font-size:13px;font-weight:600;line-height:1.3}
.sg-item .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.sg-empty{padding:16px;text-align:center;color:var(--muted);font-size:13px}

.hero{max-width:1300px;margin:auto;padding:calc(30px + 74px + env(safe-area-inset-top)) 24px 10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hero h1{font-size:26px;font-weight:800;background:linear-gradient(90deg,#e8edf6,#b6c2ff 70%,#d8b4fe);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.4px}
.hero .count{font-size:12.5px;color:var(--muted)}

.btn-ghost{margin-left:auto;background:rgba(16,21,31,.7);border:1px solid var(--border);color:var(--text);padding:9px 16px;border-radius:11px;cursor:pointer;font-size:13px;transition:.2s;backdrop-filter:blur(8px)}
.btn-ghost:hover{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.14)}

/* filter panel */
.filter-panel{max-width:1300px;margin:14px auto 0;padding:18px 24px;background:rgba(16,21,31,.8);border:1px solid var(--border);border-radius:16px;display:none;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.filter-panel.open{display:block;animation:slideDown .22s ease}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.f-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.f-label{font-size:12px;color:var(--muted);width:80px;flex-shrink:0}
.f-chip{padding:6px 13px;border-radius:20px;border:1px solid var(--border);background:var(--surface2);color:var(--muted);font-size:12.5px;cursor:pointer;transition:.15s}
.f-chip:hover{color:var(--text);border-color:var(--accent)}
.f-chip.active{background:linear-gradient(90deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;font-weight:600;box-shadow:0 4px 14px var(--glow)}
.f-actions{display:flex;gap:10px;margin-top:4px}
.btn-apply{background:linear-gradient(90deg,var(--accent),var(--accent2));border:none;color:#fff;padding:9px 22px;border-radius:11px;cursor:pointer;font-size:13px;font-weight:600;box-shadow:0 6px 18px var(--glow);transition:.2s}
.btn-apply:hover{transform:translateY(-1px);box-shadow:0 8px 24px var(--glow)}
.btn-clear{background:transparent;border:1px solid var(--border);color:var(--muted);padding:9px 18px;border-radius:11px;cursor:pointer;font-size:13px;transition:.15s}
.btn-clear:hover{color:var(--text);border-color:var(--border)}

.grid{max-width:1300px;margin:24px auto;padding:0 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:18px}
.card{background:var(--surface);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .22s cubic-bezier(.2,.8,.3,1),border-color .2s,box-shadow .22s;border:1px solid rgba(37,51,82,.55);position:relative}
.card:hover{transform:translateY(-6px);border-color:rgba(129,140,248,.55);box-shadow:0 16px 40px rgba(0,0,0,.6),0 0 24px rgba(99,102,241,.14)}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:var(--surface2);transition:transform .35s cubic-bezier(.2,.8,.3,1)}
.card:hover img{transform:scale(1.055)}
.card img{will-change:transform}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(8,10,18,.75));pointer-events:none;border-radius:inherit}
.badge{position:absolute;top:8px;left:8px;background:rgba(5,7,12,.8);color:#ffd166;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:7px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);z-index:2}
.epbadge{position:absolute;top:8px;right:8px;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:7px;box-shadow:0 3px 10px var(--glow);z-index:2}
.card .t{font-size:13px;font-weight:600;padding:9px 10px 2px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;position:relative;z-index:2}
.card .s{font-size:11.5px;color:var(--muted);padding:2px 10px 11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative;z-index:2}

.pager{display:flex;gap:8px;justify-content:center;align-items:center;padding:12px 0 46px}
.pager button{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:9px 18px;border-radius:11px;cursor:pointer;font-size:13px;transition:.18s}
.pager button:disabled{opacity:.35;cursor:default}
.pager button:not(:disabled):hover{border-color:var(--accent);box-shadow:0 0 14px rgba(99,102,241,.2)}
.pager .pg{font-size:13px;color:var(--muted);padding:0 8px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0}

@media(max-width:860px){
  .top{flex-wrap:wrap;gap:8px;padding:10px 12px}
  .search-wrap{margin-left:0;width:100%;order:3}
  .search-wrap input{padding:11px 14px 11px 38px;font-size:15px;border-radius:11px}  /* 15px: iOS không tự zoom */
  nav{overflow-x:auto;width:100%;order:2;-webkit-overflow-scrolling:touch;scrollbar-width:none;gap:1px}
  nav::-webkit-scrollbar{display:none}
  nav a{padding:10px 13px;font-size:13px}   /* vùng chạm >= 44px */
  .hero{padding:calc(16px + 108px + env(safe-area-inset-top)) 12px 4px;gap:8px}
  .hero h1{font-size:17px}
  .btn-ghost{margin-left:auto;padding:9px 13px;font-size:12.5px}
  .filter-panel{margin:10px 12px 0;padding:13px 12px}
  .f-label{width:100%}
  .f-row{gap:6px}
  .f-chip{padding:9px 13px;font-size:12.5px}  /* chip dễ bấm hơn */
  .btn-apply,.btn-clear{flex:1;padding:11px}
  .grid{margin:14px auto;padding:0 10px;grid-template-columns:repeat(3,1fr);gap:9px}
  /* badge nhỏ lại + không đè lên chữ tên phim */
  .badge,.epbadge{font-size:9px;padding:2px 6px;top:6px}
  .badge{left:6px}.epbadge{right:6px}
  .card{border-radius:11px}
  .card img{border-radius:10px 10px 0 0}
  .card .t{font-size:12px;padding:7px 8px 2px;-webkit-line-clamp:2}
  .card .s{font-size:10.5px;padding:2px 8px 9px}
  .pager{padding:12px 0 34px;gap:6px}
  .pager button{padding:11px 16px;font-size:12.5px}
  .pager .pg{font-size:12px}
  .empty{padding:44px 16px;font-size:13px}
  #historySec{padding:0 10px !important;margin-bottom:0 !important}
  #historySec h2{font-size:14px}
  #historyRow .card{min-width:104px !important;width:104px !important}
  #historyRow{gap:8px}
  .sg-item{padding:10px 12px}
  .sg-item img{width:42px;height:62px}
  .suggest{max-height:56vh}
}
@media(max-width:380px){
  .grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .card .t{font-size:11.5px}
}
/* mobile: highlight rõ hơn khi chạm */
@media(hover:none){
  .card:active{transform:scale(.97);border-color:var(--accent)}
  .sg-item:active{background:var(--surface2)}
}
*{-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>

<header>
 <div class="top">
   <a href="/" class="logo">Filmlo</a>
   <nav id="nav">
     <a href="#" data-type="home" class="active">🏠 Trang chủ</a>
     <a href="#" data-type="phim-le">🎬 Phim lẻ</a>
     <a href="#" data-type="phim-bo">📺 Phim bộ</a>
     <a href="#" data-type="hoat-hinh">🧒 Hoạt hình</a>
     <a href="#" data-type="tv-shows">🎤 TV Shows</a>
   </nav>
   <div class="search-wrap">
     <input id="search" type="text" placeholder="Tìm phim..." autocomplete="off">
     <div id="suggest" class="suggest"></div>
   </div>
 </div>
</header>

<div class="hero">
 <h1 id="pageTitle"><span id="homeTotal">Đang tải...</span></h1>
 <span class="count" id="pageCount"></span>
 <button class="btn-ghost" id="filterToggle">⚙️ Bộ lọc nâng cao</button>
</div>

<div id="filterPanel" class="filter-panel">
 <div class="f-row"><span class="f-label">Thể loại</span><span id="fCats" class="f-row"></span></div>
 <div class="f-row"><span class="f-label">Quốc gia</span><span id="fCountries" class="f-row"></span></div>
 <div class="f-row"><span class="f-label">Năm</span><span id="fYears" class="f-row"></span></div>
 <div class="f-row"><span class="f-label">Sắp xếp</span>
    <span class="f-chip" data-sort="view">👁 Xem nhiều</span>
    <span class="f-chip" data-sort="modified.time">🕐 Mới cập nhật</span>
    <span class="f-chip" data-sort="year">📅 Năm mới</span>
 </div>
 <div class="f-row"><span class="f-label">Loại</span>
    <span class="f-chip f-type" data-type="phim-le">Phim lẻ</span>
    <span class="f-chip f-type" data-type="phim-bo">Phim bộ</span>
    <span class="f-chip f-type" data-type="tv-shows">TV Shows</span>
    <span class="f-chip f-type" data-type="hoat-hinh">Hoạt hình</span>
 </div>
 <div class="f-actions">
    <button class="btn-apply" id="applyFilter">Áp dụng</button>
    <button class="btn-clear" id="clearFilter">Xóa lọc</button>
 </div>
</div>

<div id="historySec" style="max-width:1300px;margin:10px auto -10px;padding:0 24px;display:none">
  <h2 style="font-size:16px;margin-bottom:12px">⏱ Tiếp tục xem <button id="clearHist" style="background:none;border:none;color:var(--muted);font-size:11.5px;cursor:pointer;margin-left:8px">Xóa lịch sử</button></h2>
  <div id="historyRow" style="display:flex;gap:12px;overflow-x:auto;padding-bottom:8px"></div>
</div>

<div id="grid" class="grid"></div>
<div class="pager">
 <button id="prev">← Trước</button>
 <span class="pg" id="pageInfo"></span>
 <button id="next">Sau →</button>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
let page = 1, mode = "home", filterQ = "";
const imgUrl = u => !u ? "" : /^https?:/.test(u) ? u : "https://phimimg.com/" + String(u).replace(/^\/+/, "");

/* ---------- render ---------- */
function renderItems(items){
  const g = $("grid");
  if (!items || !items.length){ g.innerHTML = '<div class="empty">Không tìm thấy phim nào.</div>'; return; }
  g.innerHTML = items.map(m => {
    const img = imgUrl(m.poster_url || m.thumb_url);
    return `<div class="card" onclick="location.href='/phim/${encodeURIComponent(m.slug || "")}'">
      <img src="${esc(img)}" alt="" loading="lazy">
      ${m.quality && m.quality !== "n/a" ? `<span class="badge">${esc(m.quality)}</span>` : ""}
      ${m.episode_current ? `<span class="epbadge">${esc(m.episode_current)}</span>` : ""}
      <div class="t">${esc(m.name)}</div>
      <div class="s">${esc(m.origin_name || m.year || "")}</div>
    </div>`;
  }).join("");
}

/* ---------- shared fetch + unwrap ---------- */
// các endpoint upstream trả về shape khác nhau: {items}, {data:{items}}
async function fetchItems(url){
  const r = await fetch(url);
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  return j.items || j.data?.items || [];
}

/* ---------- tổng số phim (2 nguồn, trừ trùng) — chỉ tính 1 lần ---------- */
const fmtNum = n => Number(n || 0).toLocaleString("vi-VN");
async function loadTotal(){
  try{
    const r = await fetch("/api/stats");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    $("homeTotal").textContent = `Kho phim: ${fmtNum(d.total)} phim`;
    $("pageTitle").title = `Nguồn 1: ${fmtNum(d.source1)} • Nguồn 2: ${fmtNum(d.source2)} • Trùng: ${fmtNum(d.duplicates)}`;
  }catch{
    $("homeTotal").textContent = "Kho phim";
  }
}
loadTotal();

/* ---------- load ---------- */
async function load(){
  $("grid").innerHTML = '<div class="empty">Đang tải...</div>';
  try{
    let url;
    if (mode === "home"){ url = `/api/movies?page=${page}`; }
    else if (mode === "filter"){ url = "/api/filter/" + filterQ; }
    else if (mode === "search"){ url = `/api/search?keyword=${encodeURIComponent($("search").value.trim())}&page=${page}`; }
    else url = `/api/list/${mode}?page=${page}`;
    const items = await fetchItems(url);
    renderItems(items);
    $("pageCount").textContent = items.length ? `${items.length} phim` : "";
    $("pageInfo").textContent = `Trang ${page}`;
  }catch(e){
    console.error(e);
    $("grid").innerHTML = '<div class="empty">Lỗi tải phim. Vui lòng thử lại sau.</div>';
  }
}

function setPage(p){
  page = Math.max(1, p);
  load();
  window.scrollTo({top:0, behavior:"smooth"});
}
$("prev").onclick = () => setPage(page - 1);
$("next").onclick = () => setPage(page + 1);

/* ---------- nav ---------- */
$("nav").addEventListener("click", e => {
  const a = e.target.closest("a[data-type]");
  if (!a) return;
  e.preventDefault();
  mode = a.dataset.type;
  filterQ = "";
  page = 1;
  document.querySelectorAll("nav a").forEach(x => x.classList.toggle("active", x === a));
  const titles = {home:$("homeTotal")?.textContent || "Kho phim","phim-le":"Phim lẻ","phim-bo":"Phim bộ","hoat-hinh":"Hoạt hình","tv-shows":"TV Shows"};
  $("pageTitle").textContent = titles[mode] || "Danh sách phim";
  $("filterPanel").classList.remove("open");
  load();
});

/* ---------- search + suggestions ---------- */
let sgTimer = null;
$("search").addEventListener("input", () => {
  clearTimeout(sgTimer);
  const q = $("search").value.trim();
  if (q.length < 2){ $("suggest").classList.remove("show"); return; }
  sgTimer = setTimeout(async () => {
    try{
      const items = (await fetchItems("/api/search?keyword=" + encodeURIComponent(q) + "&limit=8")).slice(0, 8);
      const box = $("suggest");
      if (!items.length){ box.innerHTML = '<div class="sg-empty">Không tìm thấy phim.</div>'; box.classList.add("show"); return; }
      box.innerHTML = items.map(m => `
        <div class="sg-item" onclick="location.href='/phim/${encodeURIComponent(m.slug || "")}'">
          <img src="${esc(m.thumb_url ? imgUrl(m.thumb_url) : imgUrl(m.poster_url))}" alt="" loading="lazy">
          <div><div class="t">${esc(m.name)}</div><div class="s">${esc(m.year || "")} ${m.episode_current ? "• " + esc(m.episode_current) : ""}</div></div>
        </div>`).join("");
      box.classList.add("show");
    }catch{}
  }, 250);
});
$("search").addEventListener("keydown", e => {
  if (e.key === "Enter" && $("search").value.trim()){
    $("suggest").classList.remove("show");
    mode = "search"; page = 1;
    $("pageTitle").textContent = `Kết quả cho "${$("search").value.trim()}"`;
    load();
  }
});
document.addEventListener("click", e => {
  if (!e.target.closest(".search-wrap")) $("suggest").classList.remove("show");
});

/* ---------- filter ---------- */
const fState = {category:"", country:"", year:"", sort_field:"modified.time", type:""};

async function initFilterPanel(){
  try{
    const gj = r => r.ok ? r.json() : [];
    const unwrap = d => Array.isArray(d) ? d : (Array.isArray(d?.data) ? d.data : (Array.isArray(d?.data?.items) ? d.data.items : []));
    let [cats, countries, years] = await Promise.all([
      fetch("/api/categories").then(gj).then(unwrap).catch(() => []),
      fetch("/api/countries").then(gj).then(unwrap).catch(() => []),
      fetch("/api/years").then(gj).then(unwrap).catch(() => [])
    ]);
    // upstream /api/years sometimes 502s — generate fallback years
    if (!Array.isArray(years) || !years.length){
      const now = new Date().getFullYear();
      years = Array.from({length: now - 2009}, (_, i) => now - i);
    }
    $("fCats").innerHTML = '<span class="f-chip" data-cat="">Tất cả</span>' +
      (cats || []).map(c => `<span class="f-chip" data-cat="${esc(c.slug)}">${esc(c.name)}</span>`).join("");
    $("fCountries").innerHTML = '<span class="f-chip" data-country="">Tất cả</span>' +
      (countries || []).map(c => `<span class="f-chip" data-country="${esc(c.slug)}">${esc(c.name)}</span>`).join("");
    $("fYears").innerHTML = '<span class="f-chip" data-year="">Tất cả</span>' +
      (years || []).map(y => `<span class="f-chip" data-year="${y}">${y}</span>`).join("");
  }catch(e){ console.error(e); }
}

$("filterToggle").onclick = () => $("filterPanel").classList.toggle("open");

$("filterPanel").addEventListener("click", e => {
  const chip = e.target.closest(".f-chip");
  if (!chip) return;
  if (chip.dataset.cat !== undefined){
    fState.category = chip.dataset.cat;
    $("fCats").querySelectorAll(".f-chip").forEach(c => c.classList.toggle("active", c === chip));
  } else if (chip.dataset.country !== undefined){
    fState.country = chip.dataset.country;
    $("fCountries").querySelectorAll(".f-chip").forEach(c => c.classList.toggle("active", c === chip));
  } else if (chip.dataset.year !== undefined){
    fState.year = chip.dataset.year;
    $("fYears").querySelectorAll(".f-chip").forEach(c => c.classList.toggle("active", c === chip));
  } else if (chip.dataset.sort){
    fState.sort_field = chip.dataset.sort;
    chip.parentElement.querySelectorAll(".f-chip").forEach(c => c.classList.toggle("active", c === chip));
  } else if (chip.dataset.type){
    fState.type = chip.classList.contains("active") ? "" : chip.dataset.type;
    chip.classList.toggle("active");
  }
});

$("applyFilter").onclick = () => {
  const p = new URLSearchParams();
  if (fState.category) p.set("category", fState.category);
  if (fState.country) p.set("country", fState.country);
  if (fState.year) p.set("year", fState.year);
  if (fState.sort_field) p.set("sort_field", fState.sort_field);
  p.set("sort_type", "desc");
  const type = fState.type || "phim-le";
  filterQ = `${type}?${p.toString()}`;
  mode = "filter"; page = 1;
  $("pageTitle").textContent = "Kết quả lọc";
  document.querySelectorAll("nav a").forEach(x => x.classList.remove("active"));
  $("filterPanel").classList.remove("open");
  load();
};

$("clearFilter").onclick = () => {
  Object.assign(fState, {category:"", country:"", year:"", sort_field:"modified.time", type:""});
  $("filterPanel").querySelectorAll(".f-chip").forEach(c => c.classList.remove("active"));
  $("filterPanel").querySelector('.f-chip[data-sort="modified.time"]').classList.add("active");
  mode = "home"; filterQ = ""; page = 1;
  $("pageTitle").textContent = $("homeTotal")?.textContent || "Kho phim";
  document.querySelector('nav a[data-type="home"]').classList.add("active");
  load();
};

/* ---------- lịch sử xem (localStorage, giống movie.html) ---------- */
function getHistory(){
  try{ return JSON.parse(localStorage.getItem("filmlo_history") || "[]"); }catch{ return []; }
}
function renderHistory(){
  const h = getHistory();
  if (!h.length){ $("historySec").style.display = "none"; return; }
  $("historySec").style.display = "block";
  $("historyRow").innerHTML = h.slice(0, 20).map(m => `
    <div class="card" style="min-width:130px;width:130px;flex-shrink:0" onclick="location.href='/phim/${encodeURIComponent(m.slug)}'">
      <img src="${esc(imgUrl(m.thumb || m.poster))}" alt="" loading="lazy" style="aspect-ratio:2/3">
      <div class="t">${esc(m.name)}</div>
      ${m.ep ? `<div class="s" style="color:var(--accent)">${esc(m.ep)}</div>` : ""}
    </div>`).join("");
}
$("clearHist").onclick = () => { localStorage.removeItem("filmlo_history"); renderHistory(); };

/* ---------- init ---------- */
initFilterPanel();
load();
renderHistory();
</script>

</body>
